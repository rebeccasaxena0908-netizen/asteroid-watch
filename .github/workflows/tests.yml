# Offline checks on every push: lint, type check and the unit tests.
# No secrets are needed: the tests use saved fixtures and never call NASA or MySQL.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The PHP tests (lint, input validation, MySQL-down message) need the PHP CLI with pdo_mysql.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: requirements.txt in sync
        run: python -m scripts.gen_requirements --check

      - name: Secret scan (patterns; CI has no .env)
        run: git ls-files -z | xargs -0 python -m scripts.check_secrets

      - name: Unit tests
        run: python -m pytest -q --ignore=tests/integration --ignore=tests/parity
