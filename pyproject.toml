# Project metadata, dependencies and tool settings in one place.
# requirements.txt is generated from this file: make requirements

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-watch"
version = "2.0.0.dev0"
description = "NASA near-Earth data pipeline: NeoWs and JPL into MySQL, with a dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "PyMySQL>=1.1,<2",
    "SQLAlchemy>=2.0,<2.1",  # 2.1 breaks Prefect 3.9's scheduler (bulk insert of scheduled runs)
    "alembic>=1.13,<2",
    "typer>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "openpyxl>=3.1,<4",
    "prefect>=3.9,<4",
]

[project.scripts]
asteroid-watch = "pipeline.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pre-commit>=4,<5",
    "types-requests>=2.32",
    "httpx2>=2.16,<3",
]

[tool.setuptools]
packages = ["pipeline", "scripts", "api", "api.routes", "flows"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dashboard/assets/vendor"]

[tool.ruff.lint]
# E/W: style errors, F: pyflakes (unused names, undefined names), I: import order,
# B: bugbear (likely bugs), UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "scripts", "api", "flows"]

[tool.mypy]
# Non-strict to start: check what is annotated, don't require annotations everywhere.
python_version = "3.12"
files = ["pipeline", "tests", "scripts", "migrations", "api", "flows"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.prefect]
# Prefect reads these when run from this folder (CLI, server, worker). See docs/orchestration.md.
home = ".prefect"                       # Prefect's SQLite database and files stay in the project (gitignored)

[tool.prefect.api]
url = "http://127.0.0.1:4200/api"       # the local Prefect server

[tool.prefect.server]
analytics_enabled = false               # no anonymous usage data sent to Prefect

[tool.prefect.server.api]
host = "127.0.0.1"
port = 4200

[tool.prefect.logging]
extra_loggers = "pipeline"              # show the pipeline's own log lines in the Prefect UI

[tool.prefect.logging.to_api]
when_missing_flow = "ignore"            # outside a flow run (manual runs, tests) just skip the UI

[tool.prefect.results]
persist_by_default = false              # don't write task results (raw NASA data) to disk
